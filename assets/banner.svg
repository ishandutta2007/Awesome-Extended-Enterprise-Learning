<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-3deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      .glow-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .glow-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 240px;
      }
      .floating-node-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatReverse 7.5s ease-in-out infinite;
      }
      .floating-node-3 {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 8, 8;
        animation: dashFlow 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />

  <!-- Ambient Animated Lighting / Glows in Background -->
  <g style="pointer-events: none;">
    <circle class="glow-orb-1" cx="220" cy="120" r="160" fill="url(#glowCyan)" filter="url(#blurFilter)" />
    <circle class="glow-orb-2" cx="980" cy="220" r="180" fill="url(#glowPurple)" filter="url(#blurFilter)" />
  </g>

  <!-- Connected Network Grid Lines (Background Depth) -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.4" fill="none">
    <path class="stream-line" d="M 50 180 C 300 80, 450 280, 700 180 C 950 80, 1050 240, 1150 180" />
    <path class="stream-line" d="M 100 280 C 350 320, 500 120, 800 220 C 950 270, 1050 100, 1150 120" stroke="#334155" />
    <circle cx="150" cy="180" r="3" fill="#38bdf8" />
    <circle cx="450" cy="240" r="3" fill="#818cf8" />
    <circle cx="750" cy="140" r="3" fill="#c084fc" />
    <circle cx="1050" cy="200" r="3" fill="#38bdf8" />
  </g>

  <!-- Dynamic Floating Decorative Chips / Pills on Outer Edges (Doesn't obstruct center) -->
  <!-- Left Side Badges -->
  <g class="floating-node-1" transform="translate(60, 48)">
    <rect width="160" height="36" rx="18" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="18" r="6" fill="#38bdf8" />
    <text x="36" y="23" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">PARTNER PORTALS</text>
  </g>

  <g class="floating-node-2" transform="translate(40, 270)">
    <rect width="180" height="36" rx="18" fill="#1e293b" fill-opacity="0.75" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="20" cy="18" r="6" fill="#818cf8" />
    <text x="36" y="23" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">CUSTOMER SUCCESS</text>
  </g>

  <!-- Right Side Badges -->
  <g class="floating-node-3" transform="translate(980, 52)">
    <rect width="160" height="36" rx="18" fill="#1e293b" fill-opacity="0.75" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="20" cy="18" r="6" fill="#c084fc" />
    <text x="36" y="23" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">MULTI-TENANCY LMS</text>
  </g>

  <g class="floating-node-1" transform="translate(970, 268)">
    <rect width="175" height="36" rx="18" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="18" r="6" fill="#38bdf8" />
    <text x="36" y="23" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">ECOMMERCE &amp; SSO</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Key Metadata) -->
  <g text-anchor="middle">
    <!-- Top Category Eyebrow -->
    <rect x="475" y="45" width="250" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="600" y="64" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="2">EXTENDED ENTERPRISE LMS</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#titleGradient)" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Extended Enterprise Learning
    </text>

    <!-- Subtitle -->
    <text x="600" y="192" fill="#e2e8f0" font-size="18" font-weight="500" letter-spacing="0.2">
      Curated Ecosystem of SaaS Platforms &amp; Open-Source Learning Portals
    </text>

    <!-- Secondary Purpose Clarifier -->
    <text x="600" y="222" fill="#94a3b8" font-size="14" font-weight="400">
      Customer Training • Partner Enablement • Reseller Academies • Multi-Tenant LMS Architectures
    </text>

    <!-- Bottom Feature Tags Row -->
    <g transform="translate(320, 275)" font-size="12" font-weight="600">
      <rect x="0" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="82" y="19" fill="#38bdf8">Enterprise Valuations</text>

      <rect x="180" y="0" width="180" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="270" y="19" fill="#818cf8">Transparent Pricing Tiers</text>

      <rect x="375" y="0" width="185" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="467" y="19" fill="#c084fc">GitHub Stargazer Metrics</text>
    </g>
  </g>
</svg>
