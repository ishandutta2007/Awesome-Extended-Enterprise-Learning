ERCE &amp; SSO</text></g><g text-anchor="middle"><rect width="250" height="28" x="475" y="45" fill="#0f172a" stroke="#334155" stroke-width="1" rx="14"/><text x="600" y="64" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="2">EXTENDED ENTERPRISE LMS</text><text x="600" y="145" fill="url(#titleGradient)" font-size="44" font-weight="900" letter-spacing="-1">Awesome Extended Enterprise Learning</text><text x="600" y="192" fill="#e2e8f0" font-size="18" font-weight="500" letter-spacing=".2">Curated Ecosystem of SaaS Platforms &amp; Open-Source Learning Portals</text><text x="600" y="222" fill="#94a3b8" font-size="14" font-weight="400">Customer Training • Partner Enablement • Reseller Academies • Multi-Tenant LMS Architectures</text><g font-size="12" font-weight="600" transform="translate(320, 275)"><rect width="165" height="30" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="82" y="19" fill="#38bdf8">Enterprise Valuations</text><rect width="180" height="30" x="180" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="270" y="19" fill="#818cf8">Transparent Pricing Tiers</text><rect width="185" height="30" x="375" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="467" y="19" fill="#c084fc">GitHub Stargazer Metrics</text></g></g></svg>