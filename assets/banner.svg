<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0a0e1a"/></linearGradient><linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".1"/></linearGradient><linearGradient id="glowPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".7"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".1"/></linearGradient><filter id="blurFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur stdDeviation="40"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(3deg)}}@keyframes floatReverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(14px) rotate(-3deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}.glow-orb-1{animation:pulseGlow 7s ease-in-out infinite alternate;transform-origin:200px 100px}.glow-orb-2{animation:pulseGlow 9s ease-in-out infinite alternate-reverse;transform-origin:1000px 240px}.floating-node-1{animation:floatSlow 6s ease-in-out infinite}.floating-node-2{animation:floatReverse 7.5s ease-in-out infinite}.floating-node-3{animation:floatSlow 8s ease-in-out infinite}.stream-line{stroke-dasharray:8,8;animation:dashFlow 20s linear infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGradient)"/><g s